name: one-rrss

services:
  # ------------- Backend Laravel -------------
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: one-rrss-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      PHP_IDE_CONFIG: serverName=sinapsa
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [one-rrss]

  nginx:
    image: nginx:1.27-alpine
    container_name: one-rrss-nginx
    ports:
      - "48000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks: [one-rrss]

  # ------------- Reverb (WebSocket nativo Laravel) -------------
  # Se levanta dentro del container php con `php artisan reverb:start`.
  # Exponemos el puerto 8080 del container php como 68080 en el host.
  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: one-rrss-reverb
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./backend:/var/www/html
    ports:
      - "48080:8080"
    depends_on:
      - php
      - redis
    networks: [one-rrss]

  # ------------- Frontend Next.js -------------
  frontend:
    image: node:20-alpine
    container_name: one-rrss-frontend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:48000
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: "48080"
      NEXT_PUBLIC_REVERB_SCHEME: http
      NEXT_PUBLIC_REVERB_KEY: sinapsa-key-local
      BACKEND_INTERNAL_URL: http://nginx:80
      WATCHPACK_POLLING: "true"
    networks: [one-rrss]

  # ------------- Database -------------
  postgres:
    image: postgres:16-alpine
    container_name: one-rrss-postgres
    ports:
      - "45432:5432"
    environment:
      POSTGRES_DB: sinapsa
      POSTGRES_USER: sinapsa
      POSTGRES_PASSWORD: sinapsa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinapsa -d sinapsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [one-rrss]

  # ------------- Redis (cache, queues, sessions, broadcasting) -------------
  redis:
    image: redis:7-alpine
    container_name: one-rrss-redis
    ports:
      - "46379:6379"
    volumes:
      - redis_data:/data
    networks: [one-rrss]

  # ------------- Mailpit (SMTP catcher dev) -------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: one-rrss-mailpit
    ports:
      - "48025:8025"  # UI
      - "41025:1025"  # SMTP
    networks: [one-rrss]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  one-rrss:
    driver: bridge
