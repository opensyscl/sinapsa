# Nginx del host (VPS) para playground.sinapsahq.com. Copiar a /etc/nginx/sites-available/sinapsahq-playground
# y luego: certbot --nginx -d playground.sinapsahq.com
# Playground = "Web X" (demo/saas-x), contenedor `playground` en 127.0.0.1:8163
server {
    listen 80;
    listen [::]:80;
    server_name playground.sinapsahq.com;

    location / {
        proxy_pass http://127.0.0.1:8163;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
