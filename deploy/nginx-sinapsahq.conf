# Nginx del host (VPS) para Sinapsa. Copiar a /etc/nginx/sites-available/sinapsahq
# y luego: certbot --nginx -d sinapsahq.com -d www.sinapsahq.com -d app.sinapsahq.com -d api.sinapsahq.com

map $http_upgrade $sinapsa_connection_upgrade {
    default upgrade;
    ''      close;
}

# Landing + dashboard (Next)
server {
    listen 80;
    listen [::]:80;
    server_name sinapsahq.com www.sinapsahq.com app.sinapsahq.com;

    location / {
        proxy_pass http://127.0.0.1:8162;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API Laravel + webhooks + Reverb (WebSocket en /app y /apps)
server {
    listen 80;
    listen [::]:80;
    server_name api.sinapsahq.com;

    client_max_body_size 100m;

    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8161;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sinapsa_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
