<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Web X · demo cliente SaaS</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #111; }
      h1 { font-size: 22px; margin-bottom: 4px; }
      .muted { color: #666; font-size: 14px; }
      section { border: 1px solid #e5e5e5; border-radius: 24px; padding: 20px; margin-top: 16px; }
      button { background: #111; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
      button.secondary { background: #fff; color: #111; border: 1px solid #ddd; }
      button:disabled { opacity: .5; cursor: default; }
      input, select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; }
      label { display: block; font-size: 13px; margin: 10px 0 4px; }
      pre { background: #f6f6f6; border-radius: 12px; padding: 12px; font-size: 12px; overflow: auto; max-height: 280px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    </style>
  </head>
  <body>
    <h1>Web X</h1>
    <p class="muted">Un SaaS cualquiera que usa Sinapsa como pasarela hacia Google Calendar.</p>

    <section>
      <strong>1. Conectar calendario</strong>
      <p class="muted">Tu backend pide una Connect Session con su sk_ y el SDK abre el popup de Sinapsa.</p>
      <div class="row">
        <div>
          <label for="user">Usuario de Web X</label>
          <input id="user" value="cliente-a" />
        </div>
        <button id="connect">Conectar Google Calendar</button>
      </div>
    </section>

    <section>
      <strong>2. Calendarios conectados</strong>
      <div class="row" style="margin-top: 10px">
        <select id="integration"></select>
        <button class="secondary" id="refresh">Recargar</button>
      </div>
    </section>

    <section>
      <strong>3. Usar la pasarela</strong>
      <div class="row">
        <div><label for="day">Día</label><input id="day" type="date" /></div>
        <button class="secondary" id="availability">Ver ocupado</button>
        <button class="secondary" id="events">Ver eventos</button>
      </div>
      <div class="row">
        <div><label for="title">Título</label><input id="title" value="Cita de prueba Web X" /></div>
        <div><label for="time">Hora</label><input id="time" type="time" value="10:00" /></div>
        <div><label for="guest">Invitado (opcional)</label><input id="guest" type="email" placeholder="alguien@example.com" /></div>
        <button id="create">Crear evento 30 min</button>
      </div>
    </section>

    <section>
      <strong>Respuesta</strong>
      <pre id="out">—</pre>
    </section>

    <!-- El SDK se sirve desde Sinapsa (frontend :3002) -->
    <script src="http://localhost:3002/sdk.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const show = (data) => ($("out").textContent = JSON.stringify(data, null, 2));
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      $("day").value = new Date().toISOString().slice(0, 10);

      async function api(method, path, body) {
        const r = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await r.json();
        show({ status: r.status, ...data });
        return data;
      }

      async function loadIntegrations() {
        const r = await fetch("/api/integrations").then((r) => r.json());
        const sel = $("integration");
        sel.innerHTML = "";
        for (const i of r.data ?? []) {
          const o = document.createElement("option");
          o.value = i.id;
          o.textContent = `#${i.id} · ${i.email} · ${i.status} · user=${i.end_user_id ?? "-"}`;
          sel.appendChild(o);
        }
        if (!sel.options.length) sel.innerHTML = "<option value=''>Ninguno conectado</option>";
      }

      function dayRange() {
        const d = new Date(`${$("day").value}T00:00:00`);
        const end = new Date(d.getTime() + 24 * 3600 * 1000);
        return { time_min: d.toISOString(), time_max: end.toISOString() };
      }

      $("connect").onclick = async () => {
        const { session_token, error } = await api("POST", "/api/connect-session", { user_id: $("user").value });
        if (!session_token) return show({ error });
        Sinapsa.connect({
          sessionToken: session_token,
          onSuccess: (data) => { show({ evento: "connected", data }); loadIntegrations(); },
          onError: (err) => show({ evento: "error", err }),
          onCancel: () => show({ evento: "cancelled" }),
        });
      };

      $("refresh").onclick = loadIntegrations;

      $("availability").onclick = () =>
        api("GET", `/api/integrations/${$("integration").value}/availability?${new URLSearchParams(dayRange())}`);

      $("events").onclick = () =>
        api("GET", `/api/integrations/${$("integration").value}/events?${new URLSearchParams(dayRange())}`);

      $("create").onclick = () => {
        const start = new Date(`${$("day").value}T${$("time").value}:00`);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        const guest = $("guest").value.trim();
        api("POST", `/api/integrations/${$("integration").value}/events`, {
          summary: $("title").value,
          start: start.toISOString(),
          end: end.toISOString(),
          time_zone: tz,
          ...(guest ? { attendees: [{ email: guest }] } : {}),
        });
      };

      loadIntegrations();
    </script>
  </body>
</html>
